@if (message()) {
  <div class="alert" [class.alert-success]="message()?.type === 'success'" [class.alert-error]="message()?.type === 'error'">
    {{ message()?.text }}
  </div>
}

<div class="settings">
  <header class="page-header">
    <h1>Settings</h1>
  </header>

  <!-- Profile -->
  <section class="settings-section">
    <h2>Profile</h2>
    <div class="account-info">
      <p><strong>Username:</strong> {{ auth.currentUser()?.username }}</p>
      <p><strong>Email:</strong> {{ auth.currentUser()?.email }}</p>
    </div>
    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="inline-form">
      <div class="form-group">
        <label for="displayName">Display Name</label>
        <input id="displayName" type="text" formControlName="displayName" placeholder="Your display name" />
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="saving()">
        @if (saving()) { Saving… } @else { Save }
      </button>
    </form>
  </section>

  <!-- Tags -->
  <section class="settings-section">
    <h2>Manage Tags</h2>
    <form [formGroup]="newTagForm" (ngSubmit)="addTag()" class="inline-form">
      <div class="form-group">
        <label for="tagName">Tag Name</label>
        <input id="tagName" type="text" formControlName="name" placeholder="e.g. work, health" />
      </div>
      <div class="form-group">
        <label for="tagColor">Color</label>
        <input id="tagColor" type="color" formControlName="color" />
      </div>
      <button type="submit" class="btn btn-primary" [disabled]="!newTagForm.value.name?.trim()">Add Tag</button>
    </form>

    <div class="tags-list">
      @for (tag of tags(); track tag.id) {
        <div class="tag-item">
          <span class="tag-dot" [style.background]="tag.color || 'var(--accent)'"></span>
          <span>{{ tag.name }}</span>
          <button class="btn-delete" (click)="deleteTag(tag.id)" title="Delete tag">✕</button>
        </div>
      } @empty {
        <p class="empty">No tags yet.</p>
      }
    </div>
  </section>

  <!-- Export -->
  <section class="settings-section">
    <h2>Export Data</h2>
    <p class="section-desc">Download all your journal entries.</p>
    <div class="export-actions">
      <button class="btn btn-ghost" (click)="exportData('json')">Export as JSON</button>
      <button class="btn btn-ghost" (click)="exportData('csv')">Export as CSV</button>
    </div>
  </section>
</div>
