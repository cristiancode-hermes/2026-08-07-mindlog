@if (auth.isAuthenticated()) {
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>MindLog</h2>
      </div>

      <nav class="sidebar-nav">
        <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="nav-item">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a routerLink="/journal" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">📖</span> Journal
        </a>
        <a routerLink="/editor" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">✏️</span> New Entry
        </a>
        <a routerLink="/calendar" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">📅</span> Calendar
        </a>
        <a routerLink="/insights" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">📈</span> Insights
        </a>
        <a routerLink="/settings" routerLinkActive="active" class="nav-item">
          <span class="nav-icon">⚙️</span> Settings
        </a>
      </nav>

      <div class="sidebar-footer">
        <button class="theme-toggle" (click)="toggleTheme()">
          {{ darkMode() ? '☀️ Light' : '🌙 Dark' }}
        </button>
        <button class="logout-btn" (click)="logout()">🚪 Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <router-outlet />
    </main>
  </div>
} @else {
  <router-outlet />
}
